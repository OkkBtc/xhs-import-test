<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff2442">
  <title>小红书一键导入测试</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f6f6f6;
      color: #202124;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    main { width: min(100% - 28px, 560px); margin: 0 auto; padding: 36px 0 48px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    h2 { margin: 0 0 16px; font-size: 19px; }
    p { margin: 0; color: #666; }
    .card {
      margin-top: 20px;
      padding: 20px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .06);
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button, .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 12px;
      background: #ff2442;
      color: #fff;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    button.secondary, .button.secondary { background: #202124; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input, textarea {
      width: 100%;
      margin-top: 7px;
      padding: 12px 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      color: #202124;
      font: inherit;
      font-size: 16px;
    }
    textarea { min-height: 110px; resize: vertical; }
    .hint { margin-top: 12px; font-size: 14px; }
    .status {
      display: block;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #f2f2f2;
      color: #555;
      font-size: 14px;
      white-space: pre-wrap;
    }
    @media (max-width: 380px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>小红书一键导入测试</h1>
    <p>点击后会打开小红书发布页，不会自动发布。</p>

    <section class="card">
      <h2>固定内容测试</h2>
      <div class="actions">
        <a class="button" id="test-photo" href="#">测试图文</a>
        <a class="button secondary" id="test-video" href="#">测试视频</a>
      </div>
    </section>

    <form class="card" id="custom-form">
      <h2>自定义内容测试</h2>
      <label>标题
        <input id="title" required value="测试标题 ✨🌷💗" maxlength="100">
      </label>
      <label>文案
        <textarea id="body" required>测试文案 ✨🥰📸</textarea>
      </label>
      <label>话题
        <input id="topics" value="测试话题" placeholder="多个话题用空格或逗号分隔">
      </label>
      <p class="hint">输入“测试话题”会自动补成普通文本“#测试话题”；蓝色话题需在小红书里点选。</p>
      <div class="actions" style="margin-top:16px">
        <button type="submit" value="photo">自定义图文导入</button>
        <button class="secondary" type="submit" value="video">自定义视频导入</button>
      </div>
    </form>

    <section class="card">
      <h2>本地相册导入</h2>
      <p>素材只在手机本地处理，不会上传到本站。图片和视频请二选一。</p>
      <label>选择 1–18 张图片
        <input id="local-images" type="file" accept="image/*" multiple>
      </label>
      <label>或选择 1 个视频
        <input id="local-video" type="file" accept="video/*">
      </label>
      <p class="hint">点击分享时会自动复制“标题＋正文＋#话题”。小红书会忽略分享文字，需要进入后粘贴；粘贴的 #话题 是普通黑字，蓝色话题仍需在小红书里点选。</p>
      <div class="actions" style="margin-top:16px;grid-template-columns:1fr">
        <button id="share-local" type="button">复制文字并系统分享</button>
      </div>
      <output class="status" id="local-status" aria-live="polite">尚未选择素材。</output>
    </section>
  </main>

  <script>
    const imageUrl = 'https://mdn.github.io/shared-assets/images/examples/balloon.jpg';
    const videoUrl = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
    const page = type => ({ page_type: type === 'photo' ? 'photo_publish' : 'video_publish' });
    const source = { type: 'external_app', extraInfo: { subType: 'OpenSDK' } };

    function normalizeTopics(value) {
      return value.trim().split(/[\s,，#]+/).filter(Boolean).map(topic => `#${topic}`).join(' ');
    }

    function schemeUrl(type, attach) {
      return `xhsdiscover://post_new_note?attach=${encodeURIComponent(JSON.stringify(attach))}&page=${encodeURIComponent(JSON.stringify(page(type)))}&source=${encodeURIComponent(JSON.stringify(source))}`;
    }

    function draftContent() {
      const title = document.querySelector('#title').value.trim();
      const body = document.querySelector('#body').value.trim();
      const topics = normalizeTopics(document.querySelector('#topics').value);
      return { title, content: [body, topics].filter(Boolean).join('\n\n') };
    }

    function buildUrl(type, title, body, topics) {
      const content = [body.trim(), normalizeTopics(topics)].filter(Boolean).join('\n\n');
      const attach = type === 'photo'
        ? { note_title: title.trim(), note_text_v2: { content }, image_resources: [{ url: imageUrl }] }
        : { note_title: title.trim(), note_text_v2: { content }, video_resources: { video_url: videoUrl, cover_url: imageUrl } };
      return schemeUrl(type, attach);
    }

    document.querySelector('#test-photo').href = buildUrl(
      'photo', '测试标题 ✨🌷💗', '测试文案 ✨🥰📸', '#测试话题-图文'
    );
    document.querySelector('#test-video').href = buildUrl(
      'video', '测试视频 ✨🌷🎬', '测试视频 ✨🥰🎥', '#测试话题-视频'
    );

    document.querySelector('#custom-form').addEventListener('submit', event => {
      event.preventDefault();
      location.href = buildUrl(
        event.submitter.value,
        document.querySelector('#title').value,
        document.querySelector('#body').value,
        document.querySelector('#topics').value
      );
    });

    const imageInput = document.querySelector('#local-images');
    const videoInput = document.querySelector('#local-video');
    const localStatus = document.querySelector('#local-status');

    function selectedFiles() {
      return [...(imageInput.files.length ? imageInput.files : videoInput.files)];
    }

    function selectionError(files) {
      if (!files.length) return '请先选择 1–18 张图片，或选择 1 个视频。';
      if (files.every(file => file.type.startsWith('image/')))
        return files.length > 18 ? '图片最多只能选择 18 张，请重新选择。' : '';
      if (files.length === 1 && files[0].type.startsWith('video/')) return '';
      return '只能分享 1–18 张纯图片，或 1 个视频，不能混选。';
    }

    function fileSummary(files) {
      const size = files.reduce((total, file) => total + file.size, 0) / 1024 / 1024;
      const kind = files[0].type.startsWith('video/') ? '1 个视频' : `${files.length} 张图片`;
      return `已选择：${kind}\n总大小：${size.toFixed(2)} MB`;
    }

    function copyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, text.length);
      const copied = document.execCommand('copy');
      textarea.remove();
      return copied;
    }

    imageInput.addEventListener('change', () => {
      if (imageInput.files.length) videoInput.value = '';
      const files = selectedFiles();
      localStatus.textContent = selectionError(files) || fileSummary(files);
    });

    videoInput.addEventListener('change', () => {
      if (videoInput.files.length) imageInput.value = '';
      const files = selectedFiles();
      localStatus.textContent = selectionError(files) || fileSummary(files);
    });

    document.querySelector('#share-local').addEventListener('click', async () => {
      const files = selectedFiles();
      const error = selectionError(files);
      if (error) return void (localStatus.textContent = error);
      if (!navigator.share || !navigator.canShare || !navigator.canShare({ files }))
        return void (localStatus.textContent = `${fileSummary(files)}\n当前浏览器不支持分享这些本地文件，请在 Safari 中打开本页再试。`);

      const draft = draftContent();
      const copied = copyText([draft.title, draft.content].filter(Boolean).join('\n\n'));
      try {
        await navigator.share({ files, title: draft.title, text: draft.content });
        localStatus.textContent = `${fileSummary(files)}\n素材分享已完成；文字${copied ? '已复制，请在小红书中粘贴' : '未能自动复制'}。`;
      } catch (error) {
        localStatus.textContent = `${fileSummary(files)}\n系统分享未完成：${error.message}\n文字${copied ? '已经复制' : '未能自动复制'}。`;
      }
    });
  </script>
</body>
</html>
