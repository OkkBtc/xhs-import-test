<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff2442">
  <title>小红书一键导入测试</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f6f6f6;
      color: #202124;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    main { width: min(100% - 28px, 560px); margin: 0 auto; padding: 36px 0 48px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    h2 { margin: 0 0 16px; font-size: 19px; }
    p { margin: 0; color: #666; }
    .card {
      margin-top: 20px;
      padding: 20px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .06);
    }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button, .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 12px;
      background: #ff2442;
      color: #fff;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    button.secondary, .button.secondary { background: #202124; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input, textarea {
      width: 100%;
      margin-top: 7px;
      padding: 12px 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      color: #202124;
      font: inherit;
      font-size: 16px;
    }
    textarea { min-height: 110px; resize: vertical; }
    .hint { margin-top: 12px; font-size: 14px; }
    .status {
      display: block;
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #f2f2f2;
      color: #555;
      font-size: 14px;
      white-space: pre-wrap;
    }
    @media (max-width: 380px) { .actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>小红书一键导入测试</h1>
    <p>点击后会打开小红书发布页，不会自动发布。</p>

    <section class="card">
      <h2>固定内容测试</h2>
      <div class="actions">
        <a class="button" id="test-photo" href="#">测试图文</a>
        <a class="button secondary" id="test-video" href="#">测试视频</a>
      </div>
    </section>

    <form class="card" id="custom-form">
      <h2>自定义内容测试</h2>
      <label>标题
        <input id="title" required value="测试标题 ✨🌷💗" maxlength="100">
      </label>
      <label>文案
        <textarea id="body" required>测试文案 ✨🥰📸</textarea>
      </label>
      <label>话题
        <input id="topics" value="测试话题" placeholder="多个话题用空格或逗号分隔">
      </label>
      <p class="hint">输入“测试话题”会自动转换为“#测试话题”。</p>
      <div class="actions" style="margin-top:16px">
        <button type="submit" value="photo">自定义图文导入</button>
        <button class="secondary" type="submit" value="video">自定义视频导入</button>
      </div>
    </form>

    <section class="card">
      <h2>本地相册实验</h2>
      <p>素材只在手机本地处理，不会上传到本站。</p>
      <label>选择一张图片或一个视频
        <input id="local-media" type="file" accept="image/*,video/*">
      </label>
      <div class="actions" style="margin-top:16px">
        <button id="share-local" type="button">系统分享本地素材</button>
        <button class="secondary" id="try-local-id" type="button">检测并尝试资源 ID</button>
      </div>
      <output class="status" id="local-status" aria-live="polite">尚未选择素材。</output>
    </section>
  </main>

  <script>
    const imageUrl = 'https://mdn.github.io/shared-assets/images/examples/balloon.jpg';
    const videoUrl = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
    const page = type => ({ page_type: type === 'photo' ? 'photo_publish' : 'video_publish' });
    const source = { type: 'external_app', extraInfo: { subType: 'OpenSDK' } };

    function normalizeTopics(value) {
      return value.trim().split(/[\s,，#]+/).filter(Boolean).map(topic => `#${topic}`).join(' ');
    }

    function schemeUrl(type, attach) {
      return `xhsdiscover://post_new_note?attach=${encodeURIComponent(JSON.stringify(attach))}&page=${encodeURIComponent(JSON.stringify(page(type)))}&source=${encodeURIComponent(JSON.stringify(source))}`;
    }

    function draftContent() {
      const title = document.querySelector('#title').value.trim();
      const body = document.querySelector('#body').value.trim();
      const topics = normalizeTopics(document.querySelector('#topics').value);
      return { title, content: [body, topics].filter(Boolean).join('\n\n') };
    }

    function buildUrl(type, title, body, topics) {
      const content = [body.trim(), normalizeTopics(topics)].filter(Boolean).join('\n\n');
      const attach = type === 'photo'
        ? { note_title: title.trim(), note_text_v2: { content }, image_resources: [{ url: imageUrl }] }
        : { note_title: title.trim(), note_text_v2: { content }, video_resources: { video_url: videoUrl, cover_url: imageUrl } };
      return schemeUrl(type, attach);
    }

    document.querySelector('#test-photo').href = buildUrl(
      'photo', '测试标题 ✨🌷💗', '测试文案 ✨🥰📸', '#测试话题-图文'
    );
    document.querySelector('#test-video').href = buildUrl(
      'video', '测试视频 ✨🌷🎬', '测试视频 ✨🥰🎥', '#测试话题-视频'
    );

    document.querySelector('#custom-form').addEventListener('submit', event => {
      event.preventDefault();
      location.href = buildUrl(
        event.submitter.value,
        document.querySelector('#title').value,
        document.querySelector('#body').value,
        document.querySelector('#topics').value
      );
    });

    const mediaInput = document.querySelector('#local-media');
    const localStatus = document.querySelector('#local-status');
    const assetIdKeys = ['localIdentifier', 'assetIdentifier', 'imageID', 'videoID'];

    function selectedFile() {
      return mediaInput.files && mediaInput.files[0];
    }

    function assetId(file) {
      for (const key of assetIdKeys) {
        if (typeof file[key] === 'string' && file[key]) return { key, value: file[key] };
      }
      return null;
    }

    function fileSummary(file) {
      const size = (file.size / 1024 / 1024).toFixed(2);
      const found = assetId(file);
      return `${file.name}\n类型：${file.type || '浏览器未提供'}\n大小：${size} MB\n相册资源 ID：${found ? `${found.key} = ${found.value}` : '浏览器未暴露'}`;
    }

    mediaInput.addEventListener('change', () => {
      const file = selectedFile();
      localStatus.textContent = file ? fileSummary(file) : '尚未选择素材。';
    });

    document.querySelector('#share-local').addEventListener('click', async () => {
      const file = selectedFile();
      if (!file) return void (localStatus.textContent = '请先选择一张图片或一个视频。');
      if (!navigator.share || !navigator.canShare || !navigator.canShare({ files: [file] })) {
        return void (localStatus.textContent = `${fileSummary(file)}\n当前浏览器不支持分享本地文件，请在 Safari 中打开本页再试。`);
      }
      const draft = draftContent();
      try {
        await navigator.share({ files: [file], title: draft.title, text: draft.content });
        localStatus.textContent = `${fileSummary(file)}\n系统分享已完成或关闭，请检查小红书是否同时收到素材和文字。`;
      } catch (error) {
        localStatus.textContent = `${fileSummary(file)}\n系统分享未完成：${error.message}`;
      }
    });

    document.querySelector('#try-local-id').addEventListener('click', () => {
      const file = selectedFile();
      if (!file) return void (localStatus.textContent = '请先选择一张图片或一个视频。');
      const found = assetId(file);
      if (!found) {
        return void (localStatus.textContent = `${fileSummary(file)}\n检测了 ${assetIdKeys.join('、')}，均无法读取，因此没有调用 xhsdiscover。`);
      }
      const draft = draftContent();
      const type = file.type.startsWith('video/') ? 'video' : 'photo';
      const attach = type === 'photo'
        ? { note_title: draft.title, note_text_v2: { content: draft.content }, image_resources: [{ image_id: found.value }] }
        : { note_title: draft.title, note_text_v2: { content: draft.content }, video_resources: { video: { video_id: found.value } } };
      location.href = schemeUrl(type, attach);
    });
  </script>
</body>
</html>
